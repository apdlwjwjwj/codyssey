<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>필름 랭크 — 나만의 영화 티어리스트</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--panel2:#20232a;--line:#30343d;
  --text:#f3f2ee;--muted:#9b9da6;--accent:#e8bd72;
  --s:#e7a0a0;--a:#e8bd72;--b:#a8b9e8;--c:#9ec8b0;--d:#c1a4dc;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#343039 0%,transparent 45%),var(--bg);color:var(--text);font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.wrap{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:38px 0 56px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.2em;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.055em;margin:8px 0 5px;font-weight:850}
.sub{color:var(--muted);font-size:14px}
.header-note{font-size:12px;color:var(--muted);text-align:right;line-height:1.7}
.toolbar{display:flex;gap:10px;margin-bottom:22px}
.add-form{display:flex;flex:1;gap:9px;min-width:0}
input{width:100%;min-width:0;background:#1b1d23;border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--text);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e8bd721c}
.btn{border:1px solid var(--line);background:#252830;color:var(--text);border-radius:11px;padding:0 17px;font-weight:700;white-space:nowrap;transition:.18s}
.btn:hover{background:#333741;transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#201a12;border-color:var(--accent)}
.btn.primary:hover{background:#f2ce8c}
.btn.reset{color:#c4c5cb}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}
.section-head h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:#c9c9ce}
.section-head span{font-size:12px;color:var(--muted)}
.tiers{display:grid;gap:9px}
.tier{display:grid;grid-template-columns:74px minmax(0,1fr);min-height:126px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#181a20;transition:border-color .2s}
.tier.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px #e8bd7233}
.tier-label{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;font-size:25px;font-weight:900;color:#17171a}
.tier-label small{font-size:9px;letter-spacing:.13em;font-weight:800;opacity:.72}
.tier[data-tier="S"] .tier-label{background:var(--s)}
.tier[data-tier="A"] .tier-label{background:var(--a)}
.tier[data-tier="B"] .tier-label{background:var(--b)}
.tier[data-tier="C"] .tier-label{background:var(--c)}
.tier[data-tier="D"] .tier-label{background:var(--d)}
.dropzone{display:flex;align-content:flex-start;align-items:flex-start;gap:10px;padding:12px;flex-wrap:wrap;min-width:0}
.empty{color:#686b75;font-size:12px;align-self:center;padding:8px 4px}
.card{width:112px;position:relative;cursor:grab;user-select:none;animation:pop .2s ease}
.card:active{cursor:grabbing}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.poster{height:132px;border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:10px;box-shadow:0 5px 16px #0006;background:var(--poster)}
.poster:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#000b 100%)}
.poster:after{content:"";position:absolute;inset:8px;border:1px solid #ffffff40;border-radius:3px}
.poster-title{position:relative;z-index:1;font-family:Georgia,serif;font-size:15px;line-height:1.05;font-weight:700;text-shadow:0 2px 8px #000;word-break:keep-all}
.card-meta{font-size:11px;color:#aeb0b8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:.15s}
.card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
.mini{border:1px solid #414550;background:#252830;color:#ddd;border-radius:6px;font-size:10px;padding:4px 6px;flex:1}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.unranked{background:#181a20;border:1px dashed #444853;border-radius:14px;padding:14px;min-height:170px}
.unranked .dropzone{min-height:110px;padding:5px 0}
.footer{display:flex;justify-content:space-between;gap:14px;margin-top:22px;color:#747782;font-size:11px;line-height:1.7}
.count{color:var(--accent);font-weight:700}
.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal-backdrop.show{display:flex}
.modal{width:min(440px,100%);background:#202229;border:1px solid #414550;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0009}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.modal h3{font-size:23px;margin:0 0 5px}
.modal p{color:var(--muted);font-size:13px;line-height:1.7;margin:8px 0}
.close{border:0;background:#343741;color:#fff;border-radius:8px;width:30px;height:30px;font-size:18px}
.detail-poster{height:190px;border-radius:12px;margin:16px 0;background:var(--poster);display:flex;align-items:flex-end;padding:18px;font: bold 28px Georgia,serif;box-shadow:inset 0 -80px 60px -50px #000}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{background:#292c34;border-radius:9px;padding:10px}
.detail-item small{display:block;color:#8f929c;font-size:10px;margin-bottom:4px}
.detail-item strong{font-size:13px}
@media(max-width:600px){
 .wrap{width:calc(100% - 22px);padding-top:25px}
 header{align-items:flex-start}.header-note{display:none}
 .toolbar{flex-wrap:wrap}.add-form{flex-basis:100%}.btn.reset{height:42px;margin-left:auto}
 .tier{grid-template-columns:52px minmax(0,1fr);min-height:112px}
 .tier-label{font-size:21px}.dropzone{gap:8px;padding:9px}
 .card{width:calc(33.333% - 6px);max-width:112px}
 .poster{height:auto;aspect-ratio: .76;padding:7px}.poster-title{font-size:clamp(10px,3.2vw,14px)}
 .card-actions{opacity:1}.mini{font-size:9px;padding:4px 2px}
 .footer{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">YOUR PERSONAL MOVIE RANKING</div>
      <h1>필름 랭크<span style="color:var(--accent)">.</span></h1>
      <div class="sub">좋아하는 영화들을 나만의 기준으로 정리해 보세요.</div>
    </div>
    <div class="header-note">드래그 앤 드롭으로 순위를 정하고<br>나만의 영화 취향을 완성하세요.</div>
  </header>

  <div class="toolbar">
    <form class="add-form" id="addForm">
      <input id="movieInput" type="text" maxlength="40" placeholder="추가할 영화 제목을 입력하세요" autocomplete="off" aria-label="영화 제목">
      <button class="btn primary" type="submit">＋ 영화 추가</button>
    </form>
    <button class="btn reset" id="resetBtn" type="button">초기화</button>
  </div>

  <div class="section-head"><h2>티어 보드</h2><span><b class="count" id="rankedCount">0</b> / <span id="totalCount">0</span>개 분류 완료</span></div>
  <section class="tiers" id="tiers">
    <div class="tier" data-tier="S"><div class="tier-label">S<small>MASTERPIECE</small></div><div class="dropzone" data-target="S"></div></div>
    <div class="tier" data-tier="A"><div class="tier-label">A<small>EXCELLENT</small></div><div class="dropzone" data-target="A"></div></div>
    <div class="tier" data-tier="B"><div class="tier-label">B<small>GOOD</small></div><div class="dropzone" data-target="B"></div></div>
    <div class="tier" data-tier="C"><div class="tier-label">C<small>AVERAGE</small></div><div class="dropzone" data-target="C"></div></div>
    <div class="tier" data-tier="D"><div class="tier-label">D<small>NOT FOR ME</small></div><div class="dropzone" data-target="D"></div></div>
  </section>

  <div class="section-head"><h2>미분류 영화</h2><span>아직 순위를 정하지 않은 영화</span></div>
  <section class="unranked"><div class="dropzone" data-target="none" id="unranked"></div></section>
  <div class="footer"><span>TIP · 카드를 다른 등급으로 끌어다 놓거나 아래 이동 버튼을 눌러보세요.</span><span>변경 사항은 이 브라우저에 자동 저장됩니다.</span></div>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-top"><div><h3 id="modalTitle"></h3><div class="sub" id="modalSub"></div></div><button class="close" id="closeModal" aria-label="닫기">×</button></div>
    <div class="detail-poster" id="detailPoster"></div>
    <p id="modalDesc"></p>
    <div class="detail-grid">
      <div class="detail-item"><small>감독</small><strong id="modalDirector"></strong></div>
      <div class="detail-item"><small>장르</small><strong id="modalGenre"></strong></div>
      <div class="detail-item"><small>개봉 연도</small><strong id="modalYear"></strong></div>
      <div class="detail-item"><small>현재 등급</small><strong id="modalTier"></strong></div>
    </div>
  </div>
</div>

<script>
const starterMovies = [
 {id:"m1",title:"기생충",year:"2019",director:"봉준호",genre:"드라마, 스릴러",tier:"none",desc:"두 가족의 만남을 통해 계급과 불평등을 날카롭게 그려낸 블랙 코미디 스릴러.",poster:"linear-gradient(145deg,#66745b,#25372d 55%,#111b1a)",ink:"기생충"},
 {id:"m2",title:"인터스텔라",year:"2014",director:"크리스토퍼 놀란",genre:"SF, 드라마",tier:"none",desc:"인류의 미래를 위해 우주로 떠난 탐험대와 가족의 사랑을 그린 SF 대작.",poster:"linear-gradient(145deg,#d18b4d,#5d5264 52%,#101b32)",ink:"INTERSTELLAR"},
 {id:"m3",title:"라라랜드",year:"2016",director:"데이미언 셔젤",genre:"뮤지컬, 로맨스",tier:"none",desc:"꿈을 좇는 재즈 피아니스트와 배우 지망생의 사랑과 선택을 담은 뮤지컬 영화.",poster:"linear-gradient(145deg,#e77c63,#a34c7c 55%,#272b58)",ink:"LA LA LAND"},
 {id:"m4",title:"센과 치히로의 행방불명",year:"2001",director:"미야자키 하야오",genre:"애니메이션, 판타지",tier:"none",desc:"신비로운 세계에 갇힌 치히로가 부모를 구하기 위해 성장해 가는 이야기.",poster:"linear-gradient(145deg,#5ca9b1,#28616e 55%,#172d43)",ink:"千と千尋"},
 {id:"m5",title:"어벤져스: 엔드게임",year:"2019",director:"앤서니·조 루소",genre:"액션, SF",tier:"none",desc:"타노스의 핑거 스냅 이후, 살아남은 히어로들이 마지막 반격에 나선다.",poster:"linear-gradient(145deg,#c18b65,#654e54 52%,#1a2539)",ink:"ENDGAME"},
 {id:"m6",title:"범죄도시",year:"2017",director:"강윤성",genre:"액션, 범죄",tier:"none",desc:"강력반 형사 마석도가 범죄 조직을 소탕하기 위해 나서는 액션 영화.",poster:"linear-gradient(145deg,#e1a24d,#8c493c 55%,#241b1a)",ink:"범죄도시"},
 {id:"m7",title:"타이타닉",year:"1997",director:"제임스 카메론",genre:"로맨스, 드라마",tier:"none",desc:"거대한 여객선 타이타닉호에서 만난 두 남녀의 사랑과 비극을 그린 작품.",poster:"linear-gradient(145deg,#79a9c4,#365b83 55%,#111c35)",ink:"TITANIC"},
 {id:"m8",title:"토이 스토리",year:"1995",director:"존 라세터",genre:"애니메이션, 코미디",tier:"none",desc:"장난감들이 주인이 보지 않을 때 살아 움직인다는 상상에서 출발한 애니메이션.",poster:"linear-gradient(145deg,#5f9ac7,#4c8d6a 55%,#263e62)",ink:"TOY STORY"}
];
const STORAGE_KEY="film-rank-v1";
let movies=loadMovies();
let draggedId=null;
const tiers=["S","A","B","C","D","none"];
function loadMovies(){try{const saved=localStorage.getItem(STORAGE_KEY);return saved?JSON.parse(saved):starterMovies.map(m=>({...m}));}catch(e){return starterMovies.map(m=>({...m}));}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(movies));}catch(e){}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 document.querySelectorAll(".dropzone").forEach(zone=>{
  const target=zone.dataset.target;
  const list=movies.filter(m=>m.tier===target);
  zone.innerHTML=list.length?"":`<div class="empty">${target==="none"?"영화를 추가하거나 티어 구역으로 옮겨보세요.":"여기에 영화를 놓으세요."}</div>`;
  list.forEach(movie=>zone.appendChild(createCard(movie)));
 });
 const ranked=movies.filter(m=>m.tier!=="none").length;
 document.getElementById("rankedCount").textContent=ranked;
 document.getElementById("totalCount").textContent=movies.length;
}
function createCard(m){
 const card=document.createElement("article");card.className="card";card.draggable=true;card.tabIndex=0;
 card.innerHTML=`<div class="poster" style="--poster:${m.poster}"><div class="poster-title">${escapeHtml(m.ink||m.title)}</div></div><div class="card-meta">${escapeHtml(m.title)} · ${escapeHtml(m.year||"연도 미상")}</div><div class="card-actions"><button class="mini info" type="button">상세</button><button class="mini move" type="button">이동</button></div>`;
 card.addEventListener("dragstart",e=>{draggedId=m.id;e.dataTransfer.setData("text/plain",m.id);e.dataTransfer.effectAllowed="move";});
 card.addEventListener("dragend",()=>{draggedId=null;document.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));});
 card.querySelector(".info").addEventListener("click",e=>{e.stopPropagation();showDetails(m.id);});
 card.querySelector(".move").addEventListener("click",e=>{e.stopPropagation();moveMovie(m.id);});
 card.addEventListener("click",()=>showDetails(m.id));
 card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showDetails(m.id);}});
 return card;
}
document.querySelectorAll(".dropzone").forEach(zone=>{
 zone.addEventListener("dragover",e=>{e.preventDefault();zone.closest(".tier,.unranked")?.classList.add("drag-over");});
 zone.addEventListener("dragleave",e=>{if(!zone.contains(e.relatedTarget))zone.closest(".tier,.unranked")?.classList.remove("drag-over");});
 zone.addEventListener("drop",e=>{e.preventDefault();const id=e.dataTransfer.getData("text/plain")||draggedId;const m=movies.find(x=>x.id===id);if(m){m.tier=zone.dataset.target;save();render();}document.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));});
});
function moveMovie(id){
 const m=movies.find(x=>x.id===id);if(!m)return;
 const idx=tiers.indexOf(m.tier);m.tier=tiers[(idx+1)%tiers.length];save();render();
}
const palettes=[
 "linear-gradient(145deg,#d08b65,#684a58 55%,#1b2635)",
 "linear-gradient(145deg,#6c9d9a,#38536a 55%,#171d2c)",
 "linear-gradient(145deg,#d7a45e,#9a5c4e 55%,#30243a)",
 "linear-gradient(145deg,#9d85bd,#4b6488 55%,#1b273d)",
 "linear-gradient(145deg,#8aab73,#45645c 55%,#172b32)"
];
document.getElementById("addForm").addEventListener("submit",e=>{
 e.preventDefault();const input=document.getElementById("movieInput");const title=input.value.trim();if(!title){input.focus();return;}
 if(movies.some(m=>m.title.toLowerCase()===title.toLowerCase())){alert("이미 목록에 있는 영화입니다.");return;}
 const id="custom-"+Date.now();
 movies.push({id,title,year:"정보 직접 입력",director:"정보 없음",genre:"정보 없음",tier:"none",desc:"직접 추가한 영화입니다. 현재 오프라인 모드에서는 영화 정보와 포스터를 자동으로 검색하지 않습니다.",poster:palettes[movies.length%palettes.length],ink:title.length>16?title.slice(0,15)+"…":title});
 save();render();input.value="";input.focus();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
 if(!confirm("티어 분류와 추가한 영화를 모두 초기화할까요?"))return;
 movies=starterMovies.map(m=>({...m}));save();render();
});
const backdrop=document.getElementById("modalBackdrop");
function showDetails(id){
 const m=movies.find(x=>x.id===id);if(!m)return;
 document.getElementById("modalTitle").textContent=m.title;
 document.getElementById("modalSub").textContent=m.year;
 const poster=document.getElementById("detailPoster");poster.style.setProperty("--poster",m.poster);poster.textContent=m.ink||m.title;
 document.getElementById("modalDesc").textContent=m.desc;
 document.getElementById("modalDirector").textContent=m.director;
 document.getElementById("modalGenre").textContent=m.genre;
 document.getElementById("modalYear").textContent=m.year;
 document.getElementById("modalTier").textContent=m.tier==="none"?"미분류":m.tier+" 티어";
 backdrop.classList.add("show");
}
function closeModal(){backdrop.classList.remove("show");}
document.getElementById("closeModal").addEventListener("click",closeModal);
backdrop.addEventListener("click",e=>{if(e.target===backdrop)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
render();
</script>
</body>
</html>
